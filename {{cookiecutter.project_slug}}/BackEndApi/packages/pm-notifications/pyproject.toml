[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-notifications"
version = "0.1.0"
description = "ProjectMaker shared notification primitives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pm_notifications*"]
